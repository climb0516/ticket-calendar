<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>抢票日历 · 哪天几点开售</title>
  <meta name="description" content="按出行日倒推 12306 开售日期和各站起售时间，节假日、春运抢票日历，一键加入手机日历提醒">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080a0e; --panel: #12151b; --panel-2: #191d25; --hover: rgba(255,255,255,0.035);
      --line: rgba(255,255,255,0.07); --line-2: rgba(255,255,255,0.14);
      --text-1: #eef1f6; --text-2: #a0a7b4; --text-3: #656c79;
      --accent: #4f8bff; --grad: linear-gradient(120deg, #60a5fa 0%, #4f8bff 50%, #22d3ee 100%);
      --now: #f97316; --soon: #facc15; --done: #656c79; --ok: #4ade80; --bad: #f87171;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      --bg: #f6f8fb; --panel: #ffffff; --panel-2: #f0f3f8; --hover: rgba(10,30,70,0.035);
      --line: rgba(10,30,70,0.08); --line-2: rgba(10,30,70,0.16);
      --text-1: #121722; --text-2: #4f5767; --text-3: #8f97a5;
      --accent: #1d5fe0; --now: #ea580c; --soon: #ca8a04; --done: #8f97a5; --ok: #16a34a; --bad: #dc2626;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(10,30,70,0.06);
    }
    body { background: var(--bg); color: var(--text-1); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; min-height: 100vh; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 420px at 15% -10%, rgba(79,139,255,0.11), transparent 70%); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input { font: inherit; color: var(--text-1); }

    .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
      background: color-mix(in srgb, var(--bg) 75%, transparent); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .logo small { font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 2px; }
    .nav { display: flex; gap: 4px; margin-left: 10px; }
    .nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
    .nav a:hover { color: var(--text-1); background: var(--hover); }
    .spacer { flex: 1; }
    .updated { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }

    .layout { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; }
    .aside { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); }
    .pad { padding: 18px 20px; }
    h2.sec { font-size: 17px; font-weight: 700; margin: 34px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; scroll-margin-top: 80px; }
    h2.sec small { color: var(--text-3); font-weight: 500; font-size: 12.5px; }

    .hero { padding: 22px 24px; display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; }
    .hero .k { font-size: 13px; color: var(--text-2); }
    .hero .v { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
    .hero .v em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero .s { font-size: 13px; color: var(--text-3); }
    .rush { text-align: right; }
    .rush .v { font-size: 26px; }

    /* 计算器 */
    .calc { padding: 20px; display: grid; gap: 18px; }
    .calc-in { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .field label { font-size: 12px; color: var(--text-3); font-weight: 500; }
    .input { display: flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-height: 46px; }
    .input:focus-within { border-color: var(--accent); }
    .input input { background: none; border: 0; outline: 0; padding: 10px 12px; font-size: 16px; font-weight: 600; width: 100%; min-width: 0; color-scheme: dark light; }
    .field.f-date { flex: 0 1 200px; } .field.f-stn { flex: 1 1 220px; max-width: 320px; }   /* 输入框随容器伸缩，不写死宽度 */
    .quick { display: flex; gap: 6px; flex-wrap: wrap; }
    .quick button { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); }
    .quick button:hover, .quick button.on { color: var(--text-1); border-color: var(--line-2); }
    .drop { position: absolute; top: 100%; left: 0; width: 100%; min-width: 240px; max-width: calc(100vw - 32px); margin-top: 4px; background: var(--panel); box-shadow: var(--shadow); border-radius: 12px; z-index: 30; max-height: 300px; overflow: auto; display: none; }
    .drop.show { display: block; }
    .drop button { display: flex; justify-content: space-between; width: 100%; padding: 9px 14px; font-size: 13.5px; text-align: left; gap: 10px; }
    .drop button:hover, .drop button.hl { background: var(--hover); }
    .drop button span { color: var(--text-3); font-size: 12px; }
    .result { display: grid; grid-template-columns: 1fr auto; gap: 10px 20px; align-items: center; padding: 18px 20px; border-radius: 14px; background: var(--panel-2); }
    .result .big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
    .result .big small { font-size: 16px; color: var(--text-2); font-weight: 600; margin-left: 6px; }
    .result .cd { font-size: 14px; color: var(--text-2); }
    .result .cd b { color: var(--now); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; }
    .btn:hover { filter: brightness(1.1); }
    .btn.ghost { background: none; color: var(--text-2); border: 1px solid var(--line-2); }
    .hint { font-size: 12.5px; color: var(--text-3); }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { font-size: 12px; color: var(--text-3); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .table-wrap { overflow-x: auto; }
    .sale { display: inline-flex; flex-direction: column; line-height: 1.3; }
    .sale b { font-weight: 600; }
    .sale small { font-size: 11.5px; color: var(--text-3); }
    .st { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .st.now { color: var(--now); background: color-mix(in srgb, var(--now) 15%, transparent); }
    .st.soon { color: var(--soon); background: color-mix(in srgb, var(--soon) 15%, transparent); }
    .st.later { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .st.done { color: var(--done); background: var(--hover); }
    .est { font-size: 11px; color: var(--soon); margin-left: 6px; }
    .bell { font-size: 12.5px; color: var(--accent); }
    .bell:hover { text-decoration: underline; }
    .muted { color: var(--text-3); }

    .stations { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 16px; }
    .stn { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
    .stn b { font-weight: 600; }
    .stn span { color: var(--text-2); }
    .tips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tip { padding: 14px 16px; }
    .tip b { display: block; margin-bottom: 4px; }
    .tip p { font-size: 13px; color: var(--text-2); }

    .news-item { display: flex; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
    .news-item:last-child { border-bottom: 0; }
    .news-item:hover { background: var(--hover); }
    .news-item .t { flex: 1; min-width: 0; font-size: 14px; }
    .news-item:hover .t { color: var(--accent); }
    .news-item .m { font-size: 12px; color: var(--text-3); white-space: nowrap; }

    .widget { padding: 16px; }
    .widget h3 { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 10px; }
    .mini-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; gap: 8px; }
    .mini-row span:first-child { color: var(--text-2); }
    .note { font-size: 12px; color: var(--text-3); line-height: 1.7; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }

    /* 节假日表行可点开详情 */
    tr[data-kit-item]:hover td { background: var(--hover); }
    td.go { color: var(--text-3); font-size: 12.5px; }
    tr[data-kit-item]:hover td.go { color: var(--accent); }
    .stn:hover { box-shadow: 0 0 0 1px var(--line-2); }
    .stn.cur { box-shadow: 0 0 0 1px var(--accent); }
    h2.sec .kit-morelink { margin-left: auto; }
    /* 起售时间分布：横向柱状图，点柱子看该时段的车站 */
    .tbars { display: flex; flex-direction: column; gap: 3px; }
    .tbar { display: grid; grid-template-columns: 42px minmax(0, 1fr) 34px; align-items: center; gap: 8px; font-size: 12px; padding: 2px 4px; border-radius: 6px; }
    .tbar:hover { background: var(--hover); }
    .tbar span { color: var(--text-2); }
    .tbar i { display: block; height: 8px; border-radius: 4px; background: var(--accent); opacity: .75; min-width: 2px; }
    .tbar:hover i { opacity: 1; }
    .tbar.cur i { background: var(--now); opacity: 1; }
    .tbar b { font-weight: 600; text-align: right; color: var(--text-2); }
    .lbar2 { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .lbar2 .input { flex: 1 1 220px; max-width: 360px; min-height: 40px; }
    .lbar2 .input input { font-size: 14px; padding: 8px 12px; }
    .stations.lst { padding: 0; }
    .kit-lbar .kit-chips { flex: 1 1 240px; min-width: 0; }   /* 起售时段 chips 多，横滑不撑破页面 */
    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr); } .aside { position: static; }
      .topbar-inner { flex-wrap: wrap; row-gap: 6px; }
      .nav { order: 10; width: 100%; margin-left: -8px; overflow-x: auto; scrollbar-width: none; }   /* 手机上导航挪到第二行，可横滑 */
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 10px 16px; } .logo small, .updated { display: none; }
      .layout { padding: 16px 16px 50px; } .hero .v { font-size: 26px; } .rush { text-align: left; }
      .field.f-stn { max-width: none; } .result { grid-template-columns: minmax(0, 1fr); } .result .big { font-size: 24px; }
      .stations { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tips { grid-template-columns: minmax(0, 1fr); }
      th, td { padding: 9px 10px; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🚄</div>抢票日历<small>哪天几点开售</small></div>
      <nav class="nav"><a href="#calc">倒推计算</a><a href="#holidays">节假日</a><a href="#stations">起售时间</a><a href="#tips">候补技巧</a><a href="#news">动态</a></nav>
      <div class="spacer"></div>
      <span class="updated" id="updated"></span>
      <a class="icon-btn" href="https://github.com/climb0516/ticket-calendar/actions/workflows/scrape.yml" target="_blank" rel="noopener" title="立即抓取（在 GitHub Actions 点 Run workflow）">⚡</a>
      <button class="icon-btn" id="theme" title="切换主题"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <main id="main"><div class="panel pad muted">加载中…</div></main>
    <aside class="aside" id="aside"></aside>
  </div>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    if (!d) { close(true); return false; }
    render(d);
    return true;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('tk:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tk:' + k, JSON.stringify(v)); } catch {} },
};
const PRESALE = 15;                      // 预售期 15 天（含当天）
const OFFSET = PRESALE - 1;              // 出发日 − 14 天开售
// 春运按「正月初一前 15 天到后 24 天」共 40 天推算（正式日程以国家发改委 / 国铁集团公布为准）
const LUNAR_NY = { 2027: '2027-02-06', 2028: '2028-01-26', 2029: '2029-02-13' };
const HOT = ['北京南', '北京西', '上海虹桥', '广州南', '深圳北', '杭州东', '南京南', '武汉', '成都东', '重庆北', '西安北', '郑州东', '长沙南', '合肥南', '济南西', '天津西'];
let D = null, ST = {};
const state = { station: store.get('station', '杭州东'), date: null };

// ── 日期工具（全部按北京时间）──
const todayISO = () => new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
const WD = '日一二三四五六';
const md = iso => `${+iso.slice(5, 7)}月${+iso.slice(8, 10)}日`;
const mdw = iso => `${md(iso)} 周${WD[new Date(iso + 'T00:00:00Z').getUTCDay()]}`;
const saleOf = travel => addDays(travel, -OFFSET);
const stationTime = () => ST[state.station]?.[1] || null;
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
// 开售状态：已开售 / 今天 / 明天 / N 天后
function status(sale, time) {
  const today = todayISO(), d = diffDays(today, sale);
  if (d < 0) return { cls: 'done', text: '已开售' };
  if (d === 0) {
    const nowHM = new Date(Date.now() + 8 * 3600000).toISOString().slice(11, 16);
    return time && nowHM >= time ? { cls: 'done', text: '今天已开售' } : { cls: 'now', text: `今天${time ? ' ' + time : ''}开售` };
  }
  if (d === 1) return { cls: 'now', text: `明天${time ? ' ' + time : ''}` };
  if (d <= 7) return { cls: 'soon', text: `${d} 天后` };
  return { cls: 'later', text: `${d} 天后` };
}

// ── 日历提醒（.ics）：开售前 10 分钟提醒 ──
function ics(title, sale, time, desc) {
  const t = time || '08:00';
  const start = new Date(`${sale}T${t}:00+08:00`);
  const z = d => d.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ticket-calendar//CN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${sale}-${t}-${Math.random().toString(36).slice(2)}@ticket-calendar`, `DTSTAMP:${z(new Date())}`, `DTSTART:${z(start)}`, 'DURATION:PT30M',
    `SUMMARY:${title}`, `DESCRIPTION:${desc.replace(/\n/g, '\\n')}`, 'URL:https://climb0516.github.io/ticket-calendar/',
    'BEGIN:VALARM', 'TRIGGER:-PT10M', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar;charset=utf-8' }));
  a.download = `抢票提醒-${sale}.ics`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ── 视图 ──
function springRush() {
  const today = todayISO();
  for (const y of Object.keys(LUNAR_NY).sort()) {
    const ny = LUNAR_NY[y], start = addDays(ny, -15), end = addDays(ny, 24);
    if (end >= today) return { year: +y, ny, start, end, firstSale: saleOf(start) };
  }
  return null;
}
const holId = h => `${h.year}-${h.name}`;                     // 节假日详情 id：年份-名称（如 2026-国庆节）
const heroSub = () => `12306 预售期 ${PRESALE} 天（含当天）· 起售时间以出发站为准，${esc(state.station)} ${stationTime() || '—'} 开售`;
const quickBtns = () => [...new Set([state.station, ...store.get('recent', []), '北京南', '上海虹桥'])].slice(0, 5)
  .map(n => `<button data-stn="${esc(n)}" class="${n === state.station ? 'on' : ''}">${esc(n)}</button>`).join('');
const hotList = () => HOT.filter(n => ST[n]).map(n => ST[n]);

function render() {
  renderAside();
  if (KIT.route($('#main'))) return;                     // #/list/… 列表页
  const today = todayISO(), sell = addDays(today, OFFSET), rush = springRush();
  const upcoming = D.holidays.filter(h => h.end >= today);
  $('#main').innerHTML = `
    <section class="panel hero">
      <div><div class="k">今天（${mdw(today)}）开售的是</div><div class="v"><em>${mdw(sell)}</em> 的车票</div>
        <div class="s" id="heroSub">${heroSub()}</div></div>
      ${rush ? `<div class="rush" data-kit-item="holiday/${rush.year}-春运"><div class="k">${rush.year} 年春运（预计）</div><div class="v">${md(rush.start)}–${md(rush.end)}</div>
        <div class="s">首日车票 ${md(rush.firstSale)} 开售 · ${diffDays(today, rush.firstSale) > 0 ? `还有 ${diffDays(today, rush.firstSale)} 天` : '已开售'}</div></div>` : ''}
    </section>

    <h2 class="sec" id="calc">倒推计算<small>选出发日期和出发站，算出哪天几点开售</small></h2>
    <div class="panel calc">
      <div class="calc-in">
        <div class="field f-date"><label>出发日期</label><div class="input"><input id="date" type="date" value="${state.date}" min="${today}"></div></div>
        <div class="field f-stn"><label>出发站（支持拼音 / 首字母）</label><div class="input"><input id="stn" type="text" value="${esc(state.station)}" autocomplete="off" placeholder="如 杭州东 / hzd"></div><div class="drop" id="drop"></div></div>
        <div class="field"><label>常用</label><div class="quick" id="quick">${quickBtns()}</div></div>
      </div>
      <div class="result" id="result"></div>
      <div class="hint">提示：同一车次各站起售时间不同，以<b>你上车的车站</b>为准；中转、联程票按第一程出发站计算。候补购票在开售后即可提交。</div>
    </div>

    <h2 class="sec" id="holidays">节假日抢票日历<small id="holNote">和拼假攻略联动 · 按 ${esc(state.station)} ${stationTime() || ''} 起售计算 · 点行看每天开售时间</small><a class="kit-morelink" href="#/list/holidays">全部 ${D.holidays.length} 个假期 →</a></h2>
    <div class="panel"><div class="table-wrap" id="hol">${holidayTable(upcoming.slice(0, 8), true)}</div></div>

    <h2 class="sec" id="stations">各站起售时间<small>共 ${D.stations.length} 个车站 · 来自 12306 官方起售时间表 · 点车站看详情</small><a class="kit-morelink" href="#/list/stations">全部 ${D.stations.length} 个 →</a></h2>
    <div class="panel">
      <div style="padding:16px 16px 0"><div class="input" style="max-width:320px"><input id="stnSearch" type="text" placeholder="搜索车站 / 城市 / 拼音" autocomplete="off"></div></div>
      <div class="stations" id="stnGrid">${stationGrid(hotList())}</div>
    </div>

    <h2 class="sec" id="tips">候补购票与抢票技巧<small>官方规则</small></h2>
    <div class="tips">
      <div class="panel tip"><b>⏰ 提前 10 分钟准备</b><p>登录 12306、添加乘车人、核验身份证件；起售时间一到立刻提交，热门车次几秒到几分钟售罄。</p></div>
      <div class="panel tip"><b>📝 候补购票</b><p>没抢到就提交候补：每人最多 6 个候补订单，每单可选预售期内 3 个乘车日期、最多 60 个车次；有退票时自动兑现，未兑现全额退款。</p></div>
      <div class="panel tip"><b>🔁 买长坐短 / 中转</b><p>直达票紧张时，可以买覆盖你行程的更长区间，或用 12306 的中转换乘方案；按第一程出发站的起售时间抢。</p></div>
      <div class="panel tip"><b>📅 节假日返程</b><p>返程票同样是出发日前 14 天开售，返程高峰（假期最后一天）往往比去程更难抢，别忘了一起定提醒。</p></div>
    </div>

    <h2 class="sec" id="news">相关动态<small>预售期调整、春运购票、春运机票</small><a class="kit-morelink" href="#/list/news">全部 ${D.news.length} 条 →</a></h2>
    <div class="panel">${newsRows(D.news.slice(0, 6))}</div>
    <p class="note" style="margin-top:14px">开售日期按 12306 现行规则推算，节假日、春运期间如有调整以 12306 官方公告为准。机票没有统一的开售规则，以各航司公告为准。</p>`;
  renderResult();
  bindStation();
}

function renderResult() {
  if (!$('#result')) return;
  const sale = saleOf(state.date), time = stationTime(), st = status(sale, time);
  const tooFar = diffDays(todayISO(), sale) < 0;
  $('#result').innerHTML = `<div>
      <div class="hint">${mdw(state.date)} 从 ${esc(state.station)} 出发的车票</div>
      <div class="big">${mdw(sale)}<small>${time || '—'} 开售</small></div>
      <div class="cd">${tooFar ? '已开售，可以直接买或提交候补' : `<span class="st ${st.cls}">${st.text}</span>`}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${tooFar ? '' : `<button class="btn" id="addCal">📅 加入日历提醒</button>`}
      <a class="btn ghost" href="https://www.12306.cn/" target="_blank" rel="noopener">打开 12306</a></div>`;
  $('#addCal')?.addEventListener('click', () => ics(`🚄 ${md(state.date)} 车票开售（${state.station} ${time || ''}）`, sale, time,
    `${mdw(state.date)} 从 ${state.station} 出发的车票，${mdw(sale)} ${time || ''} 开售。\n提前登录 12306，没抢到记得提交候补。`));
}

// 一格开售日期：label 出行说明，travel 出行日，stn 指定车站（默认当前出发站）
function saleCell(label, travel, stn) {
  const time = stn ? ST[stn]?.[1] : stationTime(), s = saleOf(travel), st = status(s, time);
  return `<td><span class="sale"><b>${md(s)} ${time || ''}</b><small>${label} ${md(travel)} 的票</small></span> <span class="st ${st.cls}">${st.text}</span>
    ${st.cls !== 'done' ? ` <button class="bell" data-ics="${travel}" data-name="${esc(label)}"${stn ? ` data-st="${esc(stn)}"` : ''}>提醒</button>` : ''}</td>`;
}
function holidayTable(rows, withRush, stn) {
  const rush = withRush && springRush();
  const extra = rush ? `<tr data-kit-item="holiday/${rush.year}-春运"><td><b>${rush.year} 春运</b><span class="est">预计</span><div class="muted" style="font-size:12px">${md(rush.start)}–${md(rush.end)}</div></td>
    ${saleCell('春运首日', rush.start, stn)}${saleCell('除夕前', addDays(rush.ny, -2), stn)}${saleCell('节后', addDays(rush.ny, 6), stn)}<td class="go">详情 ›</td></tr>` : '';

function stationGrid(list) {

function matchStations(q, list = D.stations) {
  q = q.trim().toLowerCase();
  if (!q) return list;
  const score = s => s[0] === q ? 0 : s[0].startsWith(q) ? 1 : s[3].startsWith(q) ? 2 : s[2].startsWith(q) ? 3 : s[4].startsWith(q) ? 4 : s[0].includes(q) ? 5 : s[4].includes(q) ? 6 : 9;
  return list.map(s => [score(s), s]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1][0].length - b[1][0].length).map(x => x[1]);
}

function stationFilter(q) {
  const time = q.get('time') || '', city = q.get('city') || '', kw = q.get('q') || '', sort = q.get('sort') || 'py';
  let list = D.stations.filter(s => (!time || s[1] === time) && (!city || (city === '-' ? !s[4] : s[4] === city)));
  if (kw.trim()) list = matchStations(kw, list);
  else if (sort === 'time') list = list.slice().sort((a, b) => a[1].localeCompare(b[1]) || (a[2] || a[0]).localeCompare(b[2] || b[0]));
  else if (sort === 'py') list = list.slice().sort((a, b) => (a[2] || 'zzz').localeCompare(b[2] || 'zzz'));
  return list;
}

  }
})();
// 首页已渲染时，页内锚点（#calc 等）跳转不重渲染，只滚到对应栏目
KIT.init(() => { if (D && (KIT.parse() || !$('#result'))) render(); });
window.addEventListener('hashchange', () => { if (/^#[a-z]/i.test(location.hash)) document.getElementById(location.hash.slice(1))?.scrollIntoView(); });
</script>
